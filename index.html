<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dominican Dominoes - Realistic Edition</title>
  <style>
    body {
      background:#111;
      color:#fff;
      font-family:Arial, sans-serif;
      text-align:center;
    }

    #table {
      width:90%;
      height:400px;
      margin:20px auto;
      border:3px solid #fff;
      position:relative;
      overflow:hidden;
      background:
        linear-gradient(90deg, rgba(0,0,0,0.25), rgba(0,0,0,0.15)),
        repeating-linear-gradient(
          90deg,
          #5a3a1f 0px,
          #5a3a1f 40px,
          #6b4524 40px,
          #6b4524 80px
        );
      box-shadow:0 8px 20px rgba(0,0,0,0.7);
    }

    .domino {
      width:95px;
      height:48px;
      background:linear-gradient(145deg, #ffffff 0%, #f7f7f7 40%, #e6e6e6 100%);
      border:4px solid #000;
      border-radius:10px;
      position:absolute;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:6px;
      box-sizing:border-box;
      box-shadow:
        0px 4px 10px rgba(0,0,0,0.55),
        inset 0px 2px 3px rgba(255,255,255,0.85),
        inset 0px -2px 3px rgba(0,0,0,0.25);
      transform:scale(0.8) rotate(-18deg) translateY(-35px);
      opacity:0;
      transition:
        transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1),
        opacity 0.25s ease-out;
    }

    .domino.played {
      transform:scale(1) rotate(var(--final-rot, 0deg)) translateY(0);
      opacity:1;
    }

    .half {
      width:50%;
      height:100%;
      position:relative;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .half:first-child {
      border-right:3px solid #000;
    }

    .pip {
      width:10px;
      height:10px;
      background:#000;
      border-radius:50%;
      position:absolute;
    }

    #hand { margin-top:20px; }

    .hand-tile {
      display:inline-block;
      margin:4px;
      padding:6px 10px;
      background:#fff;
      color:#000;
      border-radius:4px;
      cursor:pointer;
      border:1px solid #000;
    }

    button {
      margin:5px;
      padding:8px 14px;
      cursor:pointer;
    }

    #scoreboard { margin-top:20px; }
  </style>
</head>

<body>
  <h1>Dominican Dominoes – Realistic Edition</h1>
  <p>Los Panas (P1 & P3) vs Los Vecinos (P2 & P4)</p>

  <div>
    <button id="startBtn">Start Game</button>
    <span id="status"></span>
  </div>

  <div id="table"></div>
  <div id="hand"></div>

  <div id="controls">
    <button id="passBtn">Pass</button>
  </div>

  <div id="scoreboard">
    <h3>Scoreboard</h3>
    <p>Los Panas: <span id="scoreA">0</span> points</p>
    <p>Los Vecinos: <span id="scoreB">0</span> points</p>
  </div>

  <audio id="clickSound">
    <source src="https://actions.google.com/sounds/v1/foley/wood_plank_flicks.ogg" type="audio/ogg">
  </audio>
  <audio id="winSound">
    <source src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg" type="audio/ogg">
  </audio>

<script>
const MAX_PIP = 6;
const PLAYERS = 4;
const TILES_PER_PLAYER = 7;

let deck = [];
let hands = [];
let currentPlayer = 0;
let chain = [];
let passes = [0,0,0,0];
let scoreA = 0;
let scoreB = 0;
let gameOver = false;

const clickSound = document.getElementById("clickSound");
const winSound = document.getElementById("winSound");

function makeDeck() {
  deck = [];
  for (let i = 0; i <= MAX_PIP; i++) {
    for (let j = i; j <= MAX_PIP; j++) {
      deck.push({ a: i, b: j });
    }
  }
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function deal() {
  hands = [];
  for (let p = 0; p < PLAYERS; p++) hands[p] = [];
  for (let r = 0; r < TILES_PER_PLAYER; r++) {
    for (let p = 0; p < PLAYERS; p++) {
      hands[p].push(deck.pop());
    }
  }
}

function findStarter() {
  for (let pip = MAX_PIP; pip >= 0; pip--) {
    for (let p = 0; p < PLAYERS; p++) {
      if (hands[p].some(t => t.a === pip && t.b === pip)) {
        return p;
      }
    }
  }
  let bestSum = -1;
  let starter = 0;
  for (let p = 0; p < PLAYERS; p++) {
    for (let t of hands[p]) {
      const sum = t.a + t.b;
      if (sum > bestSum) {
        bestSum = sum;
        starter = p;
      }
    }
  }
  return starter;
}

function pipPositions(num) {
  const positions = {
    0: [],
    1: [[50, 42]],
    2: [[32, 30],[68, 70]],
    3: [[32, 30],[50, 42],[68, 70]],
    4: [[32, 30],[32, 70],[68, 30],[68, 70]],
    5: [[32, 30],[32, 70],[68, 30],[68, 70],[50, 42]],
    6: [[32, 28],[32, 50],[32, 72],[68, 28],[68, 50],[68, 72]]
  };
  return positions[num];
}

function createHalf(num) {
  const half = document.createElement("div");
  half.className = "half";
  const pos = pipPositions(num);
  pos.forEach(([x,y]) => {
    const pip = document.createElement("div");
    pip.className = "pip";
    pip.style.left = x + "%";
    pip.style.top = y + "%";
    half.appendChild(pip);
  });
  return half;
}

function renderChain() {
  const table = document.getElementById("table");
  table.innerHTML = "";
  let x = table.clientWidth / 2;
  let y = table.clientHeight / 2;
  let offset = 100;

  chain.forEach((tile, idx) => {
    const div = document.createElement("div");
    div.className = "domino";

    const randomRot = (Math.random() * 8 - 4).toFixed(2);
    div.style.setProperty('--final-rot', randomRot + 'deg');

    div.style.left = (x + (idx - chain.length / 2) * offset) + "px";
    div.style.top = y + "px";

    div.appendChild(createHalf(tile.a));
    div.appendChild(createHalf(tile.b));

    table.appendChild(div);

    setTimeout(() => {
      div.classList.add("played");
    }, 30);
  });
}

function renderHand() {
  const handDiv = document.getElementById("hand");

  // FIX: Always clear first
  handDiv.innerHTML = "";

  if (gameOver) return;

  if (currentPlayer !== 0) {
    handDiv.textContent = "Waiting for other players...";
    return;
  }

  handDiv.innerHTML = "<h3>Your Tiles</h3>";

  hands[0].forEach((tile, idx) => {
    const span = document.createElement("span");
    span.className = "hand-tile";
    span.textContent = tile.a + " | " + tile.b;
    span.onclick = () => tryPlay(idx);
    handDiv.appendChild(span);
  });
}

function chainEnds() {
  if (chain.length === 0) return null;
  const first = chain[0];
  const last = chain[chain.length - 1];
  return { left: first.a, right: last.b };
}

function canPlayTile(tile) {
  if (chain.length === 0) return true;
  const ends = chainEnds();
  return tile.a === ends.left || tile.b === ends.left ||
         tile.a === ends.right || tile.b === ends.right;
}

function tryPlay(tileIndex) {
  if (gameOver) return;
  const tile = hands[currentPlayer][tileIndex];

  if (chain.length === 0) {
    chain.push(tile);
  } else {
    const ends = chainEnds();
    if (!canPlayTile(tile)) {
      alert("Illegal move.");
      return;
    }
    if (tile.b === ends.left) chain.unshift(tile);
    else if (tile.a === ends.left) chain.unshift({ a: tile.b, b: tile.a });
    else if (tile.a === ends.right) chain.push(tile);
    else if (tile.b === ends.right) chain.push({ a: tile.b, b: tile.a });
  }

  hands[currentPlayer].splice(tileIndex, 1);
  passes[currentPlayer] = 0;

  clickSound.currentTime = 0;
  clickSound.play();

  checkWinOrBlock();
  if (!gameOver) nextTurn();
}

function aiPlay() {
  const playable = hands[currentPlayer].filter(t => canPlayTile(t));
  if (playable.length === 0) {
    passTurn();
    return;
  }
  const tile = playable[0];
  const idx = hands[currentPlayer].indexOf(tile);
  tryPlay(idx);
}

function nextTurn() {
  currentPlayer = (currentPlayer + 1) % PLAYERS;
  updateStatus();
  renderChain();
  renderHand();
  if (currentPlayer !== 0 && !gameOver) {
    setTimeout(aiPlay, 800);
  }
}

function updateStatus(msg) {
  const s = document.getElementById("status");
  s.textContent = msg || ("Player " + (currentPlayer + 1) + " turn.");
}

function passTurn() {
  if (gameOver) return;
  passes[currentPlayer]++;
  checkWinOrBlock();
  if (!gameOver) nextTurn();
}

function teamPipTotals() {
  let teamA = 0;
  let teamB = 0;
  [0, 2].forEach(p => {
    teamA += hands[p].reduce((acc, t) => acc + t.a + t.b, 0);
  });
  [1, 3].forEach(p => {
    teamB += hands[p].reduce((acc, t) => acc + t.a + t.b, 0);
  });
  return { teamA, teamB };
}

function checkWinOrBlock() {
  for (let p = 0; p < PLAYERS; p++) {
    if (hands[p].length === 0) {
      const { teamA, teamB } = teamPipTotals();
      let winningTeam, points;
      if (p === 0 || p === 2) {
        winningTeam = "Los Panas";
        points = teamB;
        scoreA += points;
      } else {
        winningTeam = "Los Vecinos";
        points = teamA;
        scoreB += points;
      }
      updateStatus(winningTeam + " win the hand! +" + points + " points.");
      updateScoreboard();
      gameOver = true;
      winSound.currentTime = 0;
      winSound.play();
      checkMatchEnd();
      return;
    }
  }

  if (passes.every(v => v > 0)) {
    const { teamA, teamB } = teamPipTotals();
    let winningTeam, points;
    if (teamA < teamB) {
      winningTeam = "Los Panas";
      points = teamB;
      scoreA += points;
    } else {
      winningTeam = "Los Vecinos";
      points = teamA;
      scoreB += points;
    }
    updateStatus("Blocked. " + winningTeam + " win the hand! +" + points + " points.");
    updateScoreboard();
    gameOver = true;
    winSound.currentTime = 0;
    winSound.play();
    checkMatchEnd();
  }
}

function updateScoreboard() {
  document.getElementById("scoreA").textContent = scoreA;
  document.getElementById("scoreB").textContent = scoreB;
}

function checkMatchEnd() {
  if (scoreA >= 200 || scoreB >= 200) {
    let winner = scoreA >= 200 ? "Los Panas" : "Los Vecinos";
    alert(winner + " win the match!");
    scoreA = 0;
    scoreB = 0;
    updateScoreboard();
  }
}

document.getElementById("startBtn").onclick = () => {
  makeDeck();
  shuffle(deck);
  deal();
  chain = [];
  passes = [0, 0, 0, 0];
  gameOver = false;

  currentPlayer = findStarter();
  updateStatus("Player " + (currentPlayer + 1) + " starts.");
  renderChain();
  renderHand();
  if (currentPlayer !== 0) {
    setTimeout(aiPlay, 800);
  }
};

document.getElementById("passBtn").onclick = passTurn;
</script>
</body>
</html>
