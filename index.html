<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dominican Dominoes - Los Panas vs Los Vecinos</title>
  <style>
    body { background:#222; color:#fff; font-family:Arial; text-align:center; }
    #table { width:90%; height:400px; margin:20px auto; border:3px solid #fff; position:relative; }
    .domino {
      width:60px; height:30px; background:#fff; color:#000;
      border:2px solid #000; border-radius:4px;
      position:absolute; display:flex; justify-content:space-between;
      align-items:center; padding:4px; box-sizing:border-box;
    }
    #hand { margin-top:20px; }
    .hand-tile {
      display:inline-block; margin:4px; padding:6px 10px;
      background:#fff; color:#000; border-radius:4px; cursor:pointer;
      border:1px solid #000;
    }
    button { margin:5px; padding:8px 14px; }
    #scoreboard { margin-top:20px; }
  </style>
</head>
<body>
  <h1>Dominican Dominoes</h1>
  <p>Los Panas (P1 & P3) vs Los Vecinos (P2 & P4)</p>

  <div>
    <button id="startBtn">Start Game</button>
    <span id="status"></span>
  </div>

  <div id="table"></div>
  <div id="hand"></div>

  <div id="controls">
    <button id="passBtn">Pass</button>
  </div>

  <div id="scoreboard">
    <h3>Scoreboard</h3>
    <p>Los Panas: <span id="scoreA">0</span> points</p>
    <p>Los Vecinos: <span id="scoreB">0</span> points</p>
  </div>

<script>
const MAX_PIP = 6;
const PLAYERS = 4;
const TILES_PER_PLAYER = 7;

let deck = [];
let hands = [];
let currentPlayer = 0;
let chain = [];
let passes = [0,0,0,0];
let scoreA = 0; // Los Panas (P1 & P3)
let scoreB = 0; // Los Vecinos (P2 & P4);
let gameOver = false;

function makeDeck() {
  deck = [];
  for (let i = 0; i <= MAX_PIP; i++) {
    for (let j = i; j <= MAX_PIP; j++) {
      deck.push({ a: i, b: j });
    }
  }
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function deal() {
  hands = [];
  for (let p = 0; p < PLAYERS; p++) hands[p] = [];
  for (let r = 0; r < TILES_PER_PLAYER; r++) {
    for (let p = 0; p < PLAYERS; p++) {
      hands[p].push(deck.pop());
    }
  }
}

function findStarter() {
  // 1) Try highest double: 6-6 down to 0-0
  for (let pip = MAX_PIP; pip >= 0; pip--) {
    for (let p = 0; p < PLAYERS; p++) {
      if (hands[p].some(t => t.a === pip && t.b === pip)) {
        return p;
      }
    }
  }
  // 2) If no doubles, highest tile (max a+b)
  let bestSum = -1;
  let starter = 0;
  for (let p = 0; p < PLAYERS; p++) {
    for (let t of hands[p]) {
      const sum = t.a + t.b;
      if (sum > bestSum) {
        bestSum = sum;
        starter = p;
      }
    }
  }
  return starter;
}

function renderChain() {
  const table = document.getElementById("table");
  table.innerHTML = "";
  let x = table.clientWidth / 2;
  let y = table.clientHeight / 2;
  let offset = 65;

  chain.forEach((tile, idx) => {
    const div = document.createElement("div");
    div.className = "domino";
    div.style.left = (x + (idx - chain.length / 2) * offset) + "px";
    div.style.top = y + "px";
    div.textContent = tile.a + " | " + tile.b;
    table.appendChild(div);
  });
}

function renderHand() {
  const handDiv = document.getElementById("hand");
  if (gameOver) {
    handDiv.innerHTML += "<p>Game over.</p>";
    return;
  }
  handDiv.innerHTML = "<h3>Player " + (currentPlayer + 1) + " hand</h3>";
  hands[currentPlayer].forEach((tile, idx) => {
    const span = document.createElement("span");
    span.className = "hand-tile";
    span.textContent = tile.a + " | " + tile.b;
    span.onclick = () => tryPlay(idx);
    handDiv.appendChild(span);
  });
}

function chainEnds() {
  if (chain.length === 0) return null;
  const first = chain[0];
  const last = chain[chain.length - 1];
  return { left: first.a, right: last.b };
}

function canPlayTile(tile) {
  if (chain.length === 0) return true;
  const ends = chainEnds();
  return tile.a === ends.left || tile.b === ends.left ||
         tile.a === ends.right || tile.b === ends.right;
}

function tryPlay(tileIndex) {
  if (gameOver) return;
  const tile = hands[currentPlayer][tileIndex];

  if (chain.length === 0) {
    // First move: must follow Dominican starter logic (already chosen starter)
    chain.push(tile);
  } else {
    const ends = chainEnds();
    if (!canPlayTile(tile)) {
      alert("Illegal move: tile doesn't match either end.");
      return;
    }
    if (tile.b === ends.left) {
      chain.unshift(tile);
    } else if (tile.a === ends.left) {
      chain.unshift({ a: tile.b, b: tile.a });
    } else if (tile.a === ends.right) {
      chain.push(tile);
    } else if (tile.b === ends.right) {
      chain.push({ a: tile.b, b: tile.a });
    }
  }

  hands[currentPlayer].splice(tileIndex, 1);
  passes[currentPlayer] = 0;
  checkWinOrBlock();
  if (!gameOver) nextTurn();
}

function nextTurn() {
  currentPlayer = (currentPlayer + 1) % PLAYERS;
  updateStatus();
  renderChain();
  renderHand();
}

function updateStatus(msg) {
  const s = document.getElementById("status");
  s.textContent = msg || ("Player " + (currentPlayer + 1) + " turn.");
}

function passTurn() {
  if (gameOver) return;
  passes[currentPlayer]++;
  checkWinOrBlock();
  if (!gameOver) nextTurn();
}

function teamPipTotals() {
  let teamA = 0; // Los Panas: P1 & P3
  let teamB = 0; // Los Vecinos: P2 & P4

  // Player indices: 0,1,2,3
  // Team A: 0 & 2
  // Team B: 1 & 3
  [0, 2].forEach(p => {
    teamA += hands[p].reduce((acc, t) => acc + t.a + t.b, 0);
  });
  [1, 3].forEach(p => {
    teamB += hands[p].reduce((acc, t) => acc + t.a + t.b, 0);
  });

  return { teamA, teamB };
}

function checkWinOrBlock() {
  // Win: player empties hand -> their team wins
  for (let p = 0; p < PLAYERS; p++) {
    if (hands[p].length === 0) {
      const { teamA, teamB } = teamPipTotals();
      let winningTeam, points;
      if (p === 0 || p === 2) {
        winningTeam = "Los Panas";
        points = teamB; // Los Vecinos pips
        scoreA += points;
      } else {
        winningTeam = "Los Vecinos";
        points = teamA; // Los Panas pips
        scoreB += points;
      }
      updateStatus(winningTeam + " win the hand! +" + points + " points.");
      updateScoreboard();
      gameOver = true;
      return;
    }
  }

  // Block: all players passed at least once consecutively
  if (passes.every(v => v > 0)) {
    const { teamA, teamB } = teamPipTotals();
    let winningTeam, points;
    if (teamA < teamB) {
      winningTeam = "Los Panas";
      points = teamB;
      scoreA += points;
    } else if (teamB < teamA) {
      winningTeam = "Los Vecinos";
      points = teamA;
      scoreB += points;
    } else {
      updateStatus("Game blocked. Tie in pips.");
      gameOver = true;
      return;
    }
    updateStatus("Game blocked. " + winningTeam + " win the hand! +" + points + " points.");
    updateScoreboard();
    gameOver = true;
  }
}

function updateScoreboard() {
  document.getElementById("scoreA").textContent = scoreA;
  document.getElementById("scoreB").textContent = scoreB;
}

document.getElementById("startBtn").onclick = () => {
  makeDeck();
  shuffle(deck);
  deal();
  chain = [];
  passes = [0, 0, 0, 0];
  gameOver = false;

  currentPlayer = findStarter();
  updateStatus("Player " + (currentPlayer + 1) + " starts (Dominican rules).");
  renderChain();
  renderHand();
};

document.getElementById("passBtn").onclick = passTurn;
</script>
</body>
</html>
