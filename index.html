<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dominican Dominoes - Realistic Edition</title>
  <style>
    body {
      background:#222;
      color:#fff;
      font-family:Arial, sans-serif;
      text-align:center;
    }

    #table {
      width:90%;
      height:400px;
      margin:20px auto;
      border:3px solid #fff;
      position:relative;
      overflow:hidden;
      background:#5b3a1e;
      background-image:
        linear-gradient(135deg, rgba(255,255,255,0.05) 25%, transparent 25%),
        linear-gradient(225deg, rgba(255,255,255,0.05) 25%, transparent 25%),
        linear-gradient(45deg, rgba(0,0,0,0.2) 25%, transparent 25%),
        linear-gradient(315deg, rgba(0,0,0,0.2) 25%, transparent 25%);
      background-size:40px 40px;
      background-position:0 0, 0 20px, 20px -20px, -20px 0;
    }

    /* REALISTIC DOMINO TILE */
    .domino {
      width:95px;
      height:48px;
      background:linear-gradient(145deg, #ffffff 0%, #f7f7f7 40%, #e6e6e6 100%);
      border:4px solid #000;
      border-radius:10px;
      position:absolute;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:6px;
      box-sizing:border-box;

      /* Realistic 3D bevel + shine */
      box-shadow:
        0px 3px 6px rgba(0,0,0,0.45),
        inset 0px 2px 3px rgba(255,255,255,0.8),
        inset 0px -2px 3px rgba(0,0,0,0.25);

      /* rotation + slide animation */
      transform:scale(0.8) rotate(-12deg) translateY(-25px);
      opacity:0;
      transition:transform 0.35s ease-out, opacity 0.35s ease-out;
    }

    .domino.played {
      transform:scale(1) rotate(0deg) translateY(0);
      opacity:1;
    }

    .half {
      width:50%;
      height:100%;
      position:relative;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    /* Medium dividing line */
    .half:first-child {
      border-right:3px solid #000;
    }

    /* REALISTIC pip size */
    .pip {
      width:10px;
      height:10px;
      background:#000;
      border-radius:50%;
      position:absolute;
    }

      display:inline-block
