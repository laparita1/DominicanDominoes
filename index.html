<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dominican Dominoes - Realistic Edition</title>
  <style>
    body {
      background:#111;
      color:#fff;
      font-family:Arial, sans-serif;
      text-align:center;
    }

    /* Realistic wood texture */
    #table {
      width:90%;
      height:400px;
      margin:20px auto;
      border:3px solid #fff;
      position:relative;
      overflow:hidden;
      background:
        linear-gradient(90deg, rgba(0,0,0,0.25), rgba(0,0,0,0.15)),
        repeating-linear-gradient(
          90deg,
          #5a3a1f 0px,
          #5a3a1f 40px,
          #6b4524 40px,
          #6b4524 80px
        );
      box-shadow:0 8px 20px rgba(0,0,0,0.7);
    }

    /* REALISTIC DOMINO TILE */
    .domino {
      width:95px;
      height:48px;
      background:linear-gradient(145deg, #ffffff 0%, #f7f7f7 40%, #e6e6e6 100%);
      border:4px solid #000;
      border-radius:10px;
      position:absolute;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:6px;
      box-sizing:border-box;

      /* Realistic 3D bevel + shine + softer shadow */
      box-shadow:
        0px 4px 10px rgba(0,0,0,0.55),
        inset 0px 2px 3px rgba(255,255,255,0.85),
        inset 0px -2px 3px rgba(0,0,0,0.25);

      /* initial "air" state before landing */
      transform:scale(0.8) rotate(-18deg) translateY(-35px);
      opacity:0;
      transition:
        transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1),
        opacity 0.25s ease-out;
    }

    /* landed state with slight physics bounce */
    .domino.played {
      transform:scale(1) rotate(var(--final-rot, 0deg)) translateY(0);
      opacity:1;
    }

    .half {
      width:50%;
      height:100%;
      position:relative;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .half:first-child {
      border-right:3px solid #000;
    }

    .pip {
      width:10px;
      height:10px;
      background:#000;
      border-radius:50%;
      position:absolute;
    }

    #hand { margin-top:20px; }

    .hand-tile {
      display:inline-block;
      margin:4px;
      padding:6px 10px;
      background:#fff;
      color:#000;
      border-radius:4px;
      cursor:pointer;
      border:1px solid #000;
    }

    button {
      margin:5px;
      padding:8px 14px;
      cursor:pointer;
    }

    #scoreboard { margin-top:20px; }
  </style>
</head>
